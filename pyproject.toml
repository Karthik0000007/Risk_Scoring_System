[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["risk_env"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette 0.36 (pinned by FastAPI 0.110) builds its TestClient with APIs that newer
# httpx and anyio mark deprecated. They come from the test client, not from app code.
filterwarnings = [
    "ignore:The 'app' shortcut is now deprecated:DeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
